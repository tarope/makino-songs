<script>
// ▼ 季節・イベントの初期値（シート「季節・イベント」が読めたらそちらが優先）
const EV0=[["春","季節","","3/1","5/31"],["桜","中分類","春","",""],["新生活","中分類","春","",""],["夏","季節","","6/1","8/31"],["祭り","中分類","夏","",""],["花火","中分類","夏","",""],["夏の終わり","中分類","夏","",""],["秋","季節","","9/1","11/30"],["紅葉","中分類","秋","",""],["食欲・読書・文化","中分類","秋","",""],["冬","季節","","12/1","2/29"],["雪","中分類","冬","",""],["クリスマス","イベント","","12/10","12/25"],["年末","イベント","","12/27","12/31"],["年始","イベント","","1/1","1/5"],["バレンタイン","イベント","","2/1","2/14"],["バースデー","イベント","","6/10","6/24"],["周年","イベント","","10/1","10/19"]];
const LOOK={"春":"spring","夏":"summer","秋":"autumn","冬":"winter","クリスマス":"xmas","年末":"nenmatsu","年始":"nenshi","バレンタイン":"valentine","バースデー":"birthday","周年":"anniv"};
const START=new Date(2025,9,19); // 活動開始日
let EV=EV0,MODE='自動';
try{const c=JSON.parse(localStorage.getItem('mk-ev')||'null');if(c&&Array.isArray(c.ev)&&c.ev.length){EV=c.ev;MODE=c.mode||'自動'}}catch(e){}
// 「12/1」「12月1日」「2026/12/01」などを 1201 のような数値にする
function mdNum(v){v=String(v||'').normalize('NFKC').trim();let m=v.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return +m[2]*100+ +m[3];m=v.match(/^(\d{1,2})\s*[\/月.\-]\s*(\d{1,2})/);return m?+m[1]*100+ +m[2]:null}
function inRange(r,md){const s=mdNum(r[3]),e=mdNum(r[4]);if(s==null||e==null)return false;return s<=e?(md>=s&&md<=e):(md>=s||md<=e)}
const rowOf=n=>EV.find(r=>r[0]===n);
function computeActive(d){
 let mode=MODE;try{const p=new URLSearchParams(location.search).get('design');if(p)mode=p}catch(e){}
 const ev=[],se=[];
 if(mode&&mode!=='自動'){const r=rowOf(mode);const t=r?r[1]:(LOOK[mode]?(/^[春夏秋冬]$/.test(mode)?'季節':'イベント'):'');if(t==='イベント')ev.push(mode);else if(t==='季節')se.push(mode);else if(t==='中分類'&&r[2])se.push(r[2])}
 else{const md=(d.getMonth()+1)*100+d.getDate();EV.forEach(r=>{if(!inRange(r,md))return;if(r[1]==='イベント')ev.push(r[0]);else if(r[1]==='季節')se.push(r[0])})}
 return {ev,se};
}
function lookOf(act){return LOOK[act.ev.find(t=>LOOK[t])]||LOOK[act.se.find(t=>LOOK[t])]||'summer'}
let ACT=computeActive(new Date());
document.documentElement.dataset.look=lookOf(ACT);
</script>

  const g=groups.filter(x=>x.songs.length),all=g.flatMap(x=>x.songs);if(all.length)out.push({tag:se,kind:'season',groups:g,all})});
 BLOCKS=out;RECMAP=new Map();
 out.forEach(b=>b.groups.forEach(g=>g.songs.forEach(x=>{const k=key(x);if(!RECMAP.has(k))RECMAP.set(k,g.sub||b.tag)})));
}
const openAcc=new Set();let accInit=false;
function applyActive(){ACT=computeActive(new Date());decorate(lookOf(ACT));buildBlocks();if(!accInit){BLOCKS.forEach(b=>{if(b.kind==='event')openAcc.add(b.tag)});accInit=true}}

let by={},others=[];
function build(rows){
 SONGS=rows.map(r=>[r[0],r[1]]);
 by={};const seen=[];
 SONGS.forEach(([t,a])=>{if(!by[a]){by[a]=[];seen.push(a)}by[a].push(t)});
 others=seen.filter(a=>a!=='オリジナル');
 const sortKey=a=>{const k=keyOf(a);return (k.t==="abc"?"0"+(k.k==="#"?"ZZ":k.k):"1"+ROWSTART.indexOf(k.k))+norm(a)};
 others.sort((x,y)=>sortKey(x).localeCompare(sortKey(y),'ja'));
 document.getElementById('total').textContent=SONGS.length;
 document.getElementById('artists').textContent=others.length;
 document.getElementById('origN').textContent=(by['オリジナル']||[]).length+'曲';
}
function parseCSV(text){const out=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&text[i+1]=='\n')i++;row.push(f);out.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);out.push(row)}return out}
async function loadSheet(){
 try{
  const res=await fetch(SHEET_URL,{cache:'no-store'});if(!res.ok)throw 0;
  const rows=parseCSV(await res.text()).slice(1).map(r=>r.map(x=>(x||'').trim())).filter(r=>r[0]&&r[1]);
  if(!rows.length)throw 0;
  TAGS={};
  rows.forEach(r=>{const tg=splitTags(r[6]);if(tg.length)TAGS[r[1]+'\u0000'+r[0]]=tg;const k=(r[2]||'').trim();if(k)READ[r[1]]=k;const ty=(r[4]||'').trim();if(ty)TREAD[r[0]]=ty;if(r[3]&&!/^(false|0|×|x|いいえ)$/i.test(r[3].trim()))NEWS.add(r[1]+'\u0000'+r[0])});
  build(rows);
  try{
   const [sr,er]=await Promise.all([fetch(SETTING_URL,{cache:'no-store'}),fetch(SEASON_URL,{cache:'no-store'})]);
   const sv=sr.ok?parseCSV(await sr.text()):[];MODE=((sv[0]||[])[1]||'').trim()||'自動';
   const ev=er.ok?parseCSV(await er.text()).slice(1).map(r=>r.slice(0,5).map(x=>(x||'').trim())).filter(r=>r[0]&&r[1]):[];
   if(ev.length)EV=ev;
   try{localStorage.setItem('mk-ev',JSON.stringify({ev:EV,mode:MODE}))}catch(e){}
  }catch(e){}
  accInit=false;openAcc.clear();applyActive();
  render();
 }catch(e){/* 読めないときはページ内の曲リストで表示 */}
}
build(SONGS);
let filter='';
const recSec=document.getElementById('recSec'),recBox=document.getElementById('recBox'),recBtns=document.getElementById('recBtns');
const qi=document.getElementById('q'),list=document.getElementById('list'),tiles=document.getElementById('tiles'),origSec=document.getElementById('origSec');
recSec.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.acc')&&!qi.value.trim()&&!filter.startsWith('__rec:')){d.open?openAcc.add(d.dataset.tag):openAcc.delete(d.dataset.tag)}},true);
function hl(text,q){if(!q)return esc(text);const ch=[...text];let joined='',map=[];ch.forEach((c,i)=>{const n=norm(c);for(const _ of n)map.push(i);joined+=n});const k=joined.indexOf(q);if(k<0)return esc(text);const s=map[k],e=map[k+q.length-1];return esc(ch.slice(0,s).join(''))+'<mark>'+esc(ch.slice(s,e+1).join(''))+'</mark>'+esc(ch.slice(e+1).join(''))}
// ▼ あいまい検索：かな⇔ローマ字を相互に照合（「あ」→ aiko、「kimi」→ きみのソファー）
const KANA={"きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","しぇ":"she","ちゃ":"cha","ちゅ":"chu","ちょ":"cho","ちぇ":"che","にゃ":"nya","にゅ":"nyu","にょ":"nyo","ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo","りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo","じゃ":"ja","じゅ":"ju","じょ":"jo","じぇ":"je","びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo","ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","ふゅ":"fyu","てぃ":"ti","でぃ":"di","でゅ":"du","うぃ":"wi","うぇ":"we","うぉ":"wo","ゔぁ":"va","ゔぃ":"vi","ゔぇ":"ve","ゔぉ":"vo","つぁ":"tsa",
"あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko","さ":"sa","し":"shi","す":"su","せ":"se","そ":"so","た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to","な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no","は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho","ま":"ma","み":"mi","む":"mu","め":"me","も":"mo","や":"ya","ゆ":"yu","よ":"yo","ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"o","ん":"n","が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo","だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo","ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po","ゔ":"vu","ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o","ゃ":"ya","ゅ":"yu","ょ":"yo"};
function toRoma(s){let o='';for(let i=0;i<s.length;i++){const two=KANA[s.substr(i,2)];if(two&&s[i+1]&&/[ゃゅょぁぃぅぇぉ]/.test(s[i+1])){o+=two;i++;continue}const c=s[i];if(c==='っ'){const n=KANA[s.substr(i+1,2)]||KANA[s[i+1]];o+=n?n[0]:'';continue}if(c==='ー'){continue}o+=KANA[c]!==undefined?KANA[c]:c}return o}
const RCACHE=new Map();
function roma(s){let r=RCACHE.get(s);if(r===undefined){r=' '+toRoma(hira(s.normalize('NFKC').toLowerCase())).replace(/[^a-z0-9぀-鿿]+/g,' ').trim()+' ';RCACHE.set(s,r)}return r}
function hit(text,qn,qr){
 if(!qn)return true;
 if(norm(text).includes(qn))return true;
 if(!qr||!/^[a-z0-9]+$/.test(qr))return false;
 const r=roma(text);
 return qr.length<=2?r.includes(' '+qr):r.replace(/ /g,'').includes(qr);
}
const brk=s=>s.replace(/(.)〜/,'$1<br>〜');
function render(){
 const q=norm(qi.value),qr=toRoma(q);
 const songHit=(t,a)=>!q||hit(t,q,qr)||(TREAD[t]&&hit(TREAD[t],q,qr))||hit(a,q,qr)||(READ[a]&&hit(READ[a],q,qr));
 // originals
 const showOrig=!filter||filter==='オリジナル';
 const o=(by['オリジナル']||[]).filter(t=>!q||hit(t,q,qr)||(TREAD[t]&&hit(TREAD[t],q,qr))||'おりじなる'.includes(q));
 origSec.hidden=!showOrig||!o.length;
 tiles.innerHTML=o.map(t=>`<button class="tile" type="button" data-t="${esc(t)}" data-a="オリジナル">${brk(hl(t,q))}${NEWS.has('オリジナル\u0000'+t)?'<i class="new">NEW</i>':''}</button>`).join('');
 // season / event picks
 const isRec=filter.startsWith('__rec:');
 if(isRec&&!BLOCKS.some(b=>b.tag===filter.slice(6)))filter='';
 const show=filter===''?BLOCKS:filter.startsWith('__rec:')?BLOCKS.filter(b=>b.tag===filter.slice(6)):[];
 const giftHTML=l=>`<div class="tiles">${l.map(([t,a])=>`<button class="gift" type="button" data-t="${esc(t)}" data-a="${esc(a)}"><span class="gt">${brk(hl(t,q))}</span><span class="ga">${esc(a)}</span></button>`).join('')}</div>`;
 const vis=show.map(b=>({...b,groups:b.groups.map(g=>({...g,hits:g.songs.filter(([t,a])=>songHit(t,a))})).filter(g=>g.hits.length)})).filter(b=>b.groups.length);
 recBox.innerHTML=vis.map(b=>`<details class="acc ${b.kind}" data-tag="${esc(b.tag)}"${openAcc.has(b.tag)||q||filter.startsWith('__rec:')?' open':''}><summary>${EMO[b.tag]||'✨'} ${esc(b.tag)}におすすめ <span>${b.all.length}曲</span></summary><div class="acc-body"><p class="rec-lead">${esc(leadOf(b.tag))}</p>${b.groups.map(g=>(g.sub?`<h3 class="sub-h">${EMO[g.sub]||'✨'} ${esc(g.sub)}</h3>`:'')+giftHTML(g.hits)).join('')}</div></details>`).join('');
 recSec.hidden=!vis.length;
 recBtns.innerHTML=BLOCKS.map(b=>`<button class="art" type="button" data-a="__rec:${esc(b.tag)}">${EMO[b.tag]||'✨'}${esc(b.tag)}におすすめ</button>`).join('');
 let html='';
 if(filter!=='オリジナル'&&!filter.startsWith('__rec:'))for(const a of others){
  if(filter&&a!==filter)continue;
  const aHit=q&&(hit(a,q,qr)||(READ[a]&&hit(READ[a],q,qr)));
  const items=by[a].filter(t=>!q||aHit||hit(t,q,qr)||(TREAD[t]&&hit(TREAD[t],q,qr)));
  if(!items.length)continue;
  html+=`<section class="group"><h2>${hl(a,aHit?q:'')}<span>${items.length}曲</span></h2><ul>`+items.map(t=>{const r=RECMAP.get(a+'\u0000'+t);return `<li><button class="song" type="button" data-t="${esc(t)}" data-a="${esc(a)}"><span class="t">${hl(t,aHit?'':q)}${r?`<i class="xm" title="${esc(r)}におすすめ">${EMO[r]||'✨'}</i>`:''}${NEWS.has(a+'\u0000'+t)?'<i class="new">NEW</i>':''}</span><span class="r">リクエスト</span></button></li>`}).join('')+'</ul></section>';
 }
 list.innerHTML=html||(origSec.hidden&&recSec.hidden?'<p class="empty">見つからなかったよ🥺<br>ひらがな・カタカナ・英語をかえて試してみてね</p>':'');
 const act=document.getElementById('active');act.hidden=!filter;document.getElementById('clear').textContent=(filter==='オリジナル'?'オリジナルSONG':filter.startsWith('__rec:')?filter.slice(6)+'におすすめ':filter)+'  ✕';
 document.querySelectorAll('.art').forEach(b=>b.classList.toggle('on',b.dataset.a===filter));
}
qi.addEventListener('input',render);
document.getElementById('clear').addEventListener('click',()=>{filter='';render()});

// drawer
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu');
let tab='abc';
function buildDrawer(){
 const groups={};others.forEach(a=>{const k=tab==='abc'?(abcKey(a)||(kanaKey(a)?null:'#')):kanaKey(a);if(!k)return;(groups[k]=groups[k]||[]).push(a)});
 Object.values(groups).forEach(g=>g.sort((x,y)=>norm(READ[x]||x).localeCompare(norm(READ[y]||y),'ja')));
 const keys=Object.keys(groups).sort((x,y)=>tab==='kana'?ROWSTART.indexOf(x)-ROWSTART.indexOf(y):(x==='#')-(y==='#')||x.localeCompare(y));
 document.getElementById('idx').innerHTML=keys.map(k=>`<a href="#g-${tab}-${k==='#'?'num':k}" data-k="${k}">${k==='#'?'0-9':k}</a>`).join('');
 document.getElementById('dbody').innerHTML=keys.map(k=>`<h3 id="g-${tab}-${k==='#'?'num':k}">${k==='#'?'0-9':k}${tab==='kana'?'行':''}</h3><div class="arts">${groups[k].map(a=>`<button class="art${a===filter?' on':''}" type="button" data-a="${esc(a)}">${esc(a)}<span>${by[a].length}</span></button>`).join('')}</div>`).join('');
}
document.getElementById('idx').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({block:'start'})});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.k;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));buildDrawer();document.getElementById('dbody').scrollTop=0}));
function openD(){buildDrawer();drawer.hidden=scrim.hidden=false;menu.setAttribute('aria-expanded','true');document.getElementById('close').focus()}
function closeD(){drawer.hidden=scrim.hidden=true;menu.setAttribute('aria-expanded','false');menu.focus()}
menu.addEventListener('click',openD);document.getElementById('close').addEventListener('click',closeD);scrim.addEventListener('click',closeD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)closeD()});
drawer.addEventListener('click',e=>{const b=e.target.closest('.art');if(!b)return;filter=b.dataset.a;qi.value='';render();closeD();(filter==='オリジナル'?origSec:filter.startsWith('__rec:')?recSec:document.querySelector('.bar')).scrollIntoView({block:'start'})});

// copy
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2200)}
function copyReq(t,a){const msg=`「${t}」${a==='オリジナル'?'':'（'+a+'）'}リクエストです${EMOJI}`;const done=()=>say('コピーしたよ！コメント欄に貼ってね'+EMOJI);try{navigator.clipboard.writeText(msg).then(done,()=>say(msg))}catch(e){say(msg)}}
document.addEventListener('click',e=>{const b=e.target.closest('.song,.tile,.gift');if(b)copyReq(b.dataset.t,b.dataset.a)});
document.getElementById('random').addEventListener('click',()=>{const rb=filter.startsWith('__rec:')&&BLOCKS.find(b=>b.tag===filter.slice(6));const pool=!filter?SONGS:rb?rb.all:SONGS.filter(s=>s[1]===filter);if(!pool.length)return;const [t,a]=pool[Math.floor(Math.random()*pool.length)];qi.value=t;render();copyReq(t,a)});
applyActive();
render();
loadSheet();
</script>
