<style>

 --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c25;--surface:#162833;--ink:#dcf1fb;--muted:#8fb0c2;--line:#25404f;--sky:#4aa8d8;--sky-deep:#8fd3f5;--pop:#ff8cbd;--pop-soft:#3a2230;--chip:#1c3442;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c25;--surface:#162833;--ink:#dcf1fb;--muted:#8fb0c2;--line:#25404f;--sky:#4aa8d8;--sky-deep:#8fd3f5;--pop:#ff8cbd;--pop-soft:#3a2230;--chip:#1c3442;--scrim:rgba(0,0,0,.55);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:500;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:relative;overflow:hidden;background:linear-gradient(170deg,var(--sky) 0%,var(--bg) 100%)}
header .wrap{padding-block:26px 18px;position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion:no-preference){.bub{animation:rise 9s ease-in-out infinite alternate}.fairy{animation:float 3.2s ease-in-out infinite alternate}.candy{animation:wob 4s ease-in-out infinite alternate}}
@keyframes rise{to{transform:translateY(-14px)}}
@keyframes float{to{transform:translateY(-6px) rotate(-3deg)}}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.mascot{flex:none;width:68px;height:auto}
.candy{width:60px}
.title{flex:1;min-width:0;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.18em;opacity:.75}
h1{font-family:var(--f-cute);font-weight:400;font-size:clamp(28px,8.4vw,42px);line-height:1.15;margin:2px 0 4px;letter-spacing:.02em}
h1 small{display:block;font-size:.46em;color:var(--sky-deep);margin-top:4px}
.count{font-size:13px}
.count b{font-family:var(--f-cute);font-weight:400;font-size:18px;color:var(--sky-deep);font-variant-numeric:tabular-nums}

/* original songs */
.orig{padding-block:6px 4px}
.orig-head{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-cute);font-size:20px;color:var(--pop);margin:4px 0 10px}
.orig-head span{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--pop-soft);border:2px solid var(--pop);border-radius:18px 18px 18px 6px;padding:10px 12px;font-family:var(--f-cute);font-size:clamp(12px,3.3vw,15px);line-height:1.35;color:var(--ink);overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;min-height:52px}
.tile:nth-child(even){border-radius:18px 18px 6px 18px}
.tile::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 3px var(--surface)}
.tile:hover{transform:translateY(-1px)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:grid;gap:8px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:9px 16px}
.search input:focus{outline:none;border-color:var(--sky)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--sky-deep);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:10px 14px;background:var(--pop);color:#3b1028;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.chip:focus-visible,.song:focus-visible,.tile:focus-visible,.icon-btn:focus-visible,.art:focus-visible,.tab:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
.active{display:flex;gap:6px;align-items:center;font-size:13px}
.chip{font:inherit;font-size:13px;border:1.5px solid var(--sky-deep);background:var(--sky-deep);color:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer}

main .wrap{padding-block:16px 60px;display:grid;gap:18px}
.group h2{font-family:var(--f-cute);font-size:15px;font-weight:400;color:var(--sky-deep);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.group h2 span{font-family:var(--f-ui);color:var(--muted);font-size:12px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
li+li{border-top:1px dashed var(--line)}
.song{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;font-family:var(--f-list);font-size:15px}
.song .t{min-width:0;overflow-wrap:anywhere}
.song .r{flex:none;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.song:hover .r{color:var(--sky-deep)}
.new{font-style:normal;font-family:var(--f-ui);font-size:10px;font-weight:700;color:#fff;background:var(--pop);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
mark{background:none;color:var(--sky-deep);font-weight:700;border-bottom:2px solid var(--pop)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-family:var(--f-cute);font-size:18px;color:var(--sky-deep)}
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tab{flex:1;font:inherit;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--sky-deep);border-color:var(--sky-deep);color:var(--bg)}
.idx{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 8px;border-bottom:1px solid var(--line)}
.idx a{font-size:12px;color:var(--sky-deep);text-decoration:none;background:var(--chip);border-radius:8px;padding:2px 7px;min-width:14px;text-align:center}
.d-body{overflow-y:auto;padding:8px 16px 24px;flex:1}
.d-body h3{font-family:var(--f-cute);font-weight:400;font-size:16px;color:var(--pop);margin:12px 0 4px;scroll-margin-top:8px}
.arts{display:flex;flex-wrap:wrap;gap:6px}
.art{font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;text-align:left}
.art span{color:var(--muted);font-size:11px;margin-left:4px}
.art.on{border-color:var(--sky-deep);color:var(--sky-deep)}
.special{display:flex;gap:6px;padding:0 16px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:40}
footer{text-align:center;color:var(--muted);font-size:12px;padding-block:0 32px}
</style>

let filter='';
const qi=document.getElementById('q'),list=document.getElementById('list'),tiles=document.getElementById('tiles'),origSec=document.getElementById('origSec');
function hl(text,q){if(!q)return esc(text);const ch=[...text];let joined='',map=[];ch.forEach((c,i)=>{const n=norm(c);for(const _ of n)map.push(i);joined+=n});const k=joined.indexOf(q);if(k<0)return esc(text);const s=map[k],e=map[k+q.length-1];return esc(ch.slice(0,s).join(''))+'<mark>'+esc(ch.slice(s,e+1).join(''))+'</mark>'+esc(ch.slice(e+1).join(''))}
function render(){
 const q=norm(qi.value);
 // originals
 const showOrig=!filter||filter==='オリジナル';
 const o=(by['オリジナル']||[]).filter(t=>!q||norm(t).includes(q)||'おりじなる'.includes(q));
 origSec.hidden=!showOrig||!o.length;
 tiles.innerHTML=o.map(t=>`<button class="tile" type="button" data-t="${esc(t)}" data-a="オリジナル">${hl(t,q)}${NEWS.has('オリジナル\u0000'+t)?'<i class="new">NEW</i>':''}</button>`).join('');
 let html='',n=0;
 if(filter!=='オリジナル')for(const a of others){
  if(filter&&a!==filter)continue;
  const aHit=q&&norm(a).includes(q);
  const items=by[a].filter(t=>!q||aHit||norm(t).includes(q));
  if(!items.length)continue;n+=items.length;
  html+=`<section class="group"><h2>${hl(a,aHit?q:'')}<span>${items.length}曲</span></h2><ul>`+items.map(t=>`<li><button class="song" type="button" data-t="${esc(t)}" data-a="${esc(a)}"><span class="t">${hl(t,aHit?'':q)}${NEWS.has(a+'\u0000'+t)?'<i class="new">NEW</i>':''}</span><span class="r">リクエスト</span></button></li>`).join('')+'</ul></section>';
 }
 list.innerHTML=html||(origSec.hidden?'<p class="empty">見つからなかったよ🥺<br>ひらがな・カタカナ・英語をかえて試してみてね</p>':'');
 const act=document.getElementById('active');act.hidden=!filter;document.getElementById('clear').textContent=(filter==='オリジナル'?'オリジナルSONG':filter)+'  ✕';
 document.querySelectorAll('.art').forEach(b=>b.classList.toggle('on',b.dataset.a===filter));
}
qi.addEventListener('input',render);
document.getElementById('clear').addEventListener('click',()=>{filter='';render()});

// drawer
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu');
let tab='abc';
function buildDrawer(){
 const groups={};others.forEach(a=>{const k=keyOf(a);if(k.t!==tab)return;(groups[k.k]=groups[k.k]||[]).push(a)});
 const keys=Object.keys(groups).sort((x,y)=>tab==='kana'?ROWSTART.indexOf(x)-ROWSTART.indexOf(y):(x==='#')-(y==='#')||x.localeCompare(y));
 document.getElementById('idx').innerHTML=keys.map(k=>`<a href="#g-${tab}-${k==='#'?'num':k}" data-k="${k}">${k==='#'?'0-9':k}</a>`).join('');
 document.getElementById('dbody').innerHTML=keys.map(k=>`<h3 id="g-${tab}-${k==='#'?'num':k}">${k==='#'?'0-9':k==='あ'||tab==='abc'?k:k}${tab==='kana'?'行':''}</h3><div class="arts">${groups[k].map(a=>`<button class="art${a===filter?' on':''}" type="button" data-a="${esc(a)}">${esc(a)}<span>${by[a].length}</span></button>`).join('')}</div>`).join('');
}
document.getElementById('idx').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({block:'start'})});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.k;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));buildDrawer();document.getElementById('dbody').scrollTop=0}));
function openD(){buildDrawer();drawer.hidden=scrim.hidden=false;menu.setAttribute('aria-expanded','true');document.getElementById('close').focus()}
function closeD(){drawer.hidden=scrim.hidden=true;menu.setAttribute('aria-expanded','false');menu.focus()}
menu.addEventListener('click',openD);document.getElementById('close').addEventListener('click',closeD);scrim.addEventListener('click',closeD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)closeD()});
drawer.addEventListener('click',e=>{const b=e.target.closest('.art');if(!b)return;filter=b.dataset.a;qi.value='';render();closeD();(filter==='オリジナル'?origSec:document.querySelector('.bar')).scrollIntoView({block:'start'})});

// copy
const toast=document.getElementById('toast');let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2200)}
function copyReq(t,a){const msg=`「${t}」${a==='オリジナル'?'':'（'+a+'）'}リクエストです🩵`;const done=()=>say('コピーしたよ！コメント欄に貼ってね🫧');try{navigator.clipboard.writeText(msg).then(done,()=>say(msg))}catch(e){say(msg)}}
document.addEventListener('click',e=>{const b=e.target.closest('.song,.tile');if(b)copyReq(b.dataset.t,b.dataset.a)});
document.getElementById('random').addEventListener('click',()=>{const pool=!filter?SONGS:SONGS.filter(s=>s[1]===filter);const [t,a]=pool[Math.floor(Math.random()*pool.length)];qi.value=t;render();copyReq(t,a)});
render();
loadSheet();
</script>
</body></html>
